spring.application.name=ClinicManager

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log=db/db-master.xml
spring.liquibase.enabled=true

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB


logging.level.org.springframework.boot=INFO
logging.level.org.apache.catalina=INFO

server.error.include-stacktrace=never
logging.level.root=INFO


app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=18000000
app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=6379

ksef.encryption-key=${KSEF_ENCRYPTION_KEY}
card.encryption-key=${CARD_ENCRYPTION_KEY}
card.storage.path=${CARD_STORAGE_PATH:/app/data/card-files}
mfa.encryption-key=${MFA_ENCRYPTION_KEY}
app.mfa.cookie-secure=${MFA_COOKIE_SECURE:true}
app.device.cookie-secure=${DEVICE_COOKIE_SECURE:true}
app.device.reuse-grace-seconds=${DEVICE_REUSE_GRACE_SECONDS:120}
app.admin.initial-username=${ADMIN_INITIAL_USERNAME:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

ksef-sdk.base-uri=${KSEF_BASE_URI:https://api.ksef.mf.gov.pl}
ksef-sdk.suffix-uri=v2
ksef-sdk.request-timeout=30

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.asset-base-url=${MAIL_ASSET_BASE_URL:https://clinic.example.com}

app.business-zone=${APP_BUSINESS_ZONE:Europe/Warsaw}
